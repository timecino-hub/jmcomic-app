name: JM Account Validation

on:
    push:
        branches:
            - "feat/jm-cloud-favorites-import"

permissions:
    contents: read

concurrency:
    group: jm-account-validation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-ios:
        runs-on: macos-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Select Xcode
                run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

            -   name: Check privacy and one-way sync policy
                run: |
                    set -euo pipefail
                    ACCOUNT="jmcomic-ios/Sources/JMComic/Core/JmAccountStore.swift"
                    CLIENT="jmcomic-ios/Sources/JMComic/Core/JmClient.swift"
                    FAVORITES="jmcomic-ios/Sources/JMComic/Core/FavoriteStore.swift"
                    grep -q 'kSecAttrAccessibleWhenUnlockedThisDeviceOnly' "$ACCOUNT"
                    grep -q 'importCloudFavorites' "$FAVORITES"
                    grep -q 'application/x-www-form-urlencoded' "$CLIENT"
                    grep -q 'cookies\["AVS"\]' "$CLIENT"
                    ! grep -q 'UserDefaults.*password' "$ACCOUNT"
                    ! grep -q 'add_favorite\|aid.*album' "$CLIENT"

            -   name: Build unsigned iOS device target
                run: |
                    set -o pipefail
                    xcodebuild \
                        -project jmcomic-ios/jmcomic-ios.xcodeproj \
                        -scheme JMComic-iOS \
                        -destination 'generic/platform=iOS' \
                        -derivedDataPath build-device \
                        -configuration Release \
                        CODE_SIGNING_ALLOWED=NO \
                        CODE_SIGNING_REQUIRED=NO \
                        CODE_SIGN_IDENTITY="" \
                        DEVELOPMENT_TEAM="" \
                        build | tee device-build.log | tail -40

            -   name: Build iOS Simulator target
                run: |
                    set -o pipefail
                    xcodebuild \
                        -project jmcomic-ios/jmcomic-ios.xcodeproj \
                        -scheme JMComic-iOS \
                        -destination 'generic/platform=iOS Simulator' \
                        -derivedDataPath build-simulator \
                        -configuration Release \
                        build | tee simulator-build.log | tail -40

            -   name: Package unsigned IPA
                run: |
                    set -euo pipefail
                    APP=$(find build-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
                    test -n "$APP"
                    mkdir -p Payload
                    cp -R "$APP" Payload/
                    ditto -c -k --sequesterRsrc --keepParent Payload \
                        JMComic-JMCloudFavorites-v1.2.1-unsigned.ipa
                    unzip -t JMComic-JMCloudFavorites-v1.2.1-unsigned.ipa

            -   name: Upload test IPA
                uses: actions/upload-artifact@v4
                with:
                    name: JMComic-JMCloudFavorites-v1.2.1-unsigned
                    path: JMComic-JMCloudFavorites-v1.2.1-unsigned.ipa
                    if-no-files-found: error
                    retention-days: 7

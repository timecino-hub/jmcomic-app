name: Account review fix validation

on:
  push:
    branches:
      - feat/jm-cloud-favorites-import

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify response handling
        run: |
          CLIENT=jmcomic-ios/Sources/JMComic/Core/JmClient.swift
          grep -q '响应缺少有效 code 字段' "$CLIENT"
          grep -q 'if authenticated, apiCode == 401 || apiCode == 403' "$CLIENT"
          ! grep -q 'normalized.contains("login")' "$CLIENT"
          ! grep -q 'normalized.contains("member")' "$CLIENT"

      - name: Build device Release
        run: |
          xcodebuild \
            -project jmcomic-ios/jmcomic-ios.xcodeproj \
            -scheme JMComic-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build -quiet

      - name: Build simulator Release
        run: |
          xcodebuild \
            -project jmcomic-ios/jmcomic-ios.xcodeproj \
            -scheme JMComic-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build -quiet

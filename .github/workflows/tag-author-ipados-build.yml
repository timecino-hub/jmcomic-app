name: Combined iPadOS tag build

on:
  push:
    branches:
      - test/jm-tag-author-ipados-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify combined feature wiring
        run: |
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' jmcomic-ios/jmcomic-ios.xcodeproj/project.pbxproj
          grep -q 'return prefersHiddenSidebar ? 4 : 5' jmcomic-ios/Sources/JMComic/App.swift
          grep -q 'func login(username:' jmcomic-ios/Sources/JMComic/Core/JmClient.swift
          grep -q 'mainTag: 2' jmcomic-ios/Sources/JMComic/Core/JmClient.swift
          grep -q 'mainTag: 3' jmcomic-ios/Sources/JMComic/Core/JmClient.swift
          grep -q 'case author(String)' jmcomic-ios/Sources/JMComic/UI/Shared.swift
          grep -q 'case tag(String)' jmcomic-ios/Sources/JMComic/UI/Shared.swift

      - name: Build device Release and package unsigned IPA
        run: |
          chmod +x jmcomic-ios/package-ipados.sh
          jmcomic-ios/package-ipados.sh dist/JMComic-iPadOS-JMCloud-TagAuthor-v1.2.1-unsigned.ipa

      - name: Verify packaged app metadata
        run: |
          APP=$(find jmcomic-ios/build-ipados/Build/Products -type d -name '*.app' | head -1)
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist" | grep -qx '1'
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$APP/Info.plist" | grep -qx '2'
          test -s dist/JMComic-iPadOS-JMCloud-TagAuthor-v1.2.1-unsigned.ipa

      - name: Build simulator Release
        run: |
          xcodebuild \
            -project jmcomic-ios/jmcomic-ios.xcodeproj \
            -scheme JMComic-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build -quiet

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-iPadOS-JMCloud-TagAuthor-v1.2.1-unsigned
          path: dist/JMComic-iPadOS-JMCloud-TagAuthor-v1.2.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
